<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f9fb" />
    <title>Builder</title>
    <link rel="stylesheet" href="/styles/builder.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="header">
        <h1 class="header-title">Builder</h1>
        <button type="button" class="btn-ghost" id="btnNewSession">New chat</button>
      </header>

      <main class="chat" id="chat" aria-live="polite"></main>

      <div class="activity-strip" id="activityStrip" aria-live="polite" hidden>
        <span class="activity-dot" aria-hidden="true"></span>
        <span id="activityLabel">Working…</span>
      </div>

      <footer class="composer">
        <label class="sr-only" for="composerInput">Message</label>
        <textarea
          id="composerInput"
          rows="2"
          placeholder="Describe what to build or change…"
        ></textarea>
        <button type="button" class="btn-primary" id="btnSend" disabled>Send</button>
      </footer>

      <section class="preview-dock" id="previewDock">
        <div class="preview-toolbar">
          <span class="preview-label">Live preview</span>
          <span class="badge" id="previewBadge" hidden>Live</span>
          <button type="button" class="btn-ghost btn-sm" id="btnTogglePreview" aria-expanded="true">
            Hide
          </button>
        </div>
        <div class="preview-frame-wrap" id="previewWrap">
          <div class="phone-frame">
            <iframe
              id="previewFrame"
              title="Live website preview"
              loading="lazy"
            ></iframe>
            <p class="preview-empty" id="previewEmpty">Preview appears when your site is ready.</p>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
